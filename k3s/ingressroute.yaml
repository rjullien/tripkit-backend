# TripKit IngressRoute — Traefik CRD (not Ingress)
# Requires: middleware-authelia.yaml applied first
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: tripkit
  namespace: tripkit
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`tripkit.bapttf.com`)
      kind: Rule
      middlewares:
        # Order matters: strip client-supplied Remote-* headers FIRST, then
        # let Authelia inject the authenticated identity.
        - name: strip-remote-headers
        - name: forwardauth-authelia
      services:
        - name: tripkit-frontend
          port: 80
  tls:
    secretName: tripkit-tls
