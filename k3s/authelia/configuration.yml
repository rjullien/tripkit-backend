# Authelia configuration
# Docs: https://www.authelia.com/configuration/
---
theme: dark

server:
  address: tcp://0.0.0.0:9091/

log:
  level: info

# ── Authentication Backend ──────────────────────────────────────────────────
# File-based user database (perfect for small family use)
authentication_backend:
  file:
    path: /config/users_database.yml
    password:
      algorithm: argon2id
      iterations: 3
      memory: 65536
      parallelism: 4
      key_length: 32
      salt_length: 16

# ── Session ─────────────────────────────────────────────────────────────────
session:
  name: authelia_session
  same_site: lax
  expiration: 7d
  inactivity: 3d
  remember_me: 1M
  cookies:
    - domain: bapttf.com
      authelia_url: https://auth.juju.bapttf.com
      default_redirection_url: https://tripkit.bapttf.com

# ── Storage ─────────────────────────────────────────────────────────────────
# SQLite for minimal footprint (no external DB needed)
storage:
  local:
    path: /data/db.sqlite3
  encryption_key: # SET VIA ENV: AUTHELIA_STORAGE_ENCRYPTION_KEY

# ── Notifier ────────────────────────────────────────────────────────────────
# Filesystem notifier for dev/testing (writes to file instead of sending email)
# Replace with SMTP for production password reset emails
notifier:
  filesystem:
    filename: /data/notification.txt
  # smtp:
  #   host: smtp.gmail.com
  #   port: 587
  #   username: your-email@gmail.com
  #   sender: "Famille Juju Auth <noreply@bapttf.com>"

# ── Access Control ──────────────────────────────────────────────────────────
access_control:
  default_policy: deny
  rules:
    # All family members can access TripKit
    - domain: tripkit.bapttf.com
      policy: one_factor
      subject:
        - "group:family"

    # All family members can access future apps on *.juju.bapttf.com
    - domain: "*.juju.bapttf.com"
      policy: one_factor
      subject:
        - "group:family"

    # Admins can access everything
    - domain: "*.bapttf.com"
      policy: one_factor
      subject:
        - "group:admin"

# ── OIDC Provider (for future apps) ────────────────────────────────────────
# Uncomment when you want apps to use Authelia as an OIDC IdP
# identity_providers:
#   oidc:
#     hmac_secret: # SET VIA ENV
#     jwks:
#       - key_id: main
#         algorithm: RS256
#         use: sig
#         key: # SET VIA ENV or file
#     clients:
#       - client_id: tripkit
#         client_name: TripKit
#         client_secret: # hashed
#         public: false
#         authorization_policy: one_factor
#         redirect_uris:
#           - https://tripkit.bapttf.com/oauth2/callback
#         scopes: [openid, profile, email, groups]

# ── TOTP (2FA) ──────────────────────────────────────────────────────────────
totp:
  issuer: juju.bapttf.com
  period: 30
  skew: 1

# ── WebAuthn (Passkeys/Face ID) ────────────────────────────────────────────
webauthn:
  display_name: Famille Juju
