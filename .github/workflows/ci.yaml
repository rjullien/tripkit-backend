name: CI — Tests + Build

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      frontend_ref:
        description: 'tripkit-frontend ref to compare the contract fixtures against (empty = its default branch)'
        required: false
        default: ''

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: go.sum
      - run: go test -v -count=1 -race ./...

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: go.sum
      - name: Run E2E tests (in-memory SQLite)
        run: CGO_ENABLED=1 go test -v -count=1 -run TestE2E ./internal/handlers/

  # The construction contract fixtures are copied BY HAND into tripkit-frontend
  # (internal/handlers/testdata/contract/ -> tests/fixtures/construction-contract/).
  # The committed sha256 manifest catches a partial copy, but a stale copy that
  # travels with its own stale manifest satisfies both suites, so the only real
  # guard is comparing the two checkouts. The `test` job above runs on this repo
  # alone and can only SKIP that comparison; this job is where it actually runs.
  fixtures-cross-repo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: tripkit-backend
      - uses: actions/checkout@v4
        with:
          repository: rjullien/tripkit-frontend
          # Compare against the frontend branch this change is meant to ship
          # with: FRONTEND_REF on a workflow_dispatch, the default branch
          # otherwise. A cross-repo checkout of a private repo needs a PAT with
          # `repo` scope in CROSS_REPO_TOKEN; GITHUB_TOKEN only covers this repo.
          ref: ${{ github.event.inputs.frontend_ref || '' }}
          token: ${{ secrets.CROSS_REPO_TOKEN || secrets.GITHUB_TOKEN }}
          path: tripkit-frontend
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: tripkit-backend/go.sum
      - name: Compare the golden fixtures across both repos
        working-directory: tripkit-backend
        # TRIPKIT_REQUIRE_FRONTEND_FIXTURES=1 turns the "frontend not checked out"
        # skip into a failure, so a broken checkout cannot make this job green.
        env:
          TRIPKIT_REQUIRE_FRONTEND_FIXTURES: '1'
        run: go test -v -count=1 -run TestContractFixtures ./internal/handlers/

  build-and-push:
    needs: [test, e2e]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
            type=sha,prefix=sha-
      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ github.event.release.tag_name }}
